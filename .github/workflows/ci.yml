name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Forbidden-string grep
        run: |
          set +e
          rg -i -f FORBIDDEN.txt --glob "!docs/**" --glob "!grok-design*" --glob "!.git/**" --glob "!FORBIDDEN.txt"
          status=$?
          set -e
          # rg exits 0 on matches, 1 on no match, 2+ on error. Matches must fail the job.
          if [ "$status" -eq 0 ]; then
            echo "::error::Forbidden IP strings found"
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "No forbidden strings."
            exit 0
          fi
          echo "::error::ripgrep failed with status $status"
          exit "$status"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
