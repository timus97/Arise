# May fail `up` until the API exists (PR 08). No stub /health app in this PR.
# v1 launch is localhost only — no Caddy, no custom domain.
services:
  arise:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      RUNTIME: node
      SERVE_STATIC: "true"
      WEB_DIST: /app/web
      DATABASE_PATH: /data/arise.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
    volumes:
      - arise-data:/data
    ports:
      - "8080:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  arise-data:
