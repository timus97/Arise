# v1 launch: docker compose up --build on a fresh named volume.
# Localhost HTTP only — no Caddy, no custom domain, no Workers.
services:
  arise:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      RUNTIME: node
      SERVE_STATIC: "true"
      WEB_DIST: /app/web
      DATABASE_PATH: /data/arise.sqlite
      APP_ORIGIN: http://localhost:8080
      BETTER_AUTH_URL: http://localhost:8080
    volumes:
      - arise-data:/data
    ports:
      - "8080:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  arise-data:
